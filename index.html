<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise Quest</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(#2b124c,#5a189a);
    color:white;
    text-align:center;
}

header{
    background:#3c096c;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.card{
    background:rgba(255,255,255,.08);
    margin:20px;
    padding:20px;
    border-radius:20px;
}

button{
    width:90%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:15px;
    font-size:18px;
    background:#9d4edd;
    color:white;
}

button:hover{
    background:#c77dff;
}

h1{
    margin:0;
}

</style>

</head>

<body>

<header>

<h1>⚔️ Rise Quest</h1>

<p>みちゃの冒険</p>

</header>

<div class="card">

<h2>Lv.1</h2>

<p>❤️❤️❤️❤️❤️</p>

<p>EXP 0 / 100</p>

<p>🪙 Gold 0</p>

<p>🔥 連続出勤 0日</p>

</div>

<div class="card">

<h2>今日のクエスト</h2>

<button>🌞 起きた</button>

<button>💼 出勤した</button>

<button>⏰ 遅刻したけど出勤</button>

<button>📵 スマホ我慢</button>

</div>

<div class="card">

<h3>今日のひとこと</h3>

<p>「遅刻でも出勤したら勝ち。」</p>

</div>

</body>
</html>
